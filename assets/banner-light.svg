<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="Columnata de la Escuela de Atenas atravesada por circuitos posthumanos, con el nudo borromeo en el frontón">
  <defs>
    <linearGradient id="cieloL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#e9d9b9"/>
    </linearGradient>
    <pattern id="grecaL" width="48" height="28" patternUnits="userSpaceOnUse">
      <path d="M2 26 H46 V6 H14 V20 H32" fill="none" stroke="#8f7d5a" stroke-width="5"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#cieloL)"/>
  <rect y="0" width="1600" height="28" fill="url(#grecaL)"/>
  <rect y="472" width="1600" height="28" fill="url(#grecaL)"/>

  <!-- constelaciones / nodos -->
  <g fill="#0d4038" opacity="0.45">
    <circle cx="90" cy="90" r="4"/><circle cx="150" cy="150" r="3"/>
    <circle cx="1510" cy="90" r="4"/><circle cx="1450" cy="160" r="3"/>
    <circle cx="300" cy="70" r="3"/><circle cx="1300" cy="70" r="3"/>
    <circle cx="80" cy="220" r="3"/><circle cx="1520" cy="230" r="3"/>
  </g>
  <g stroke="#0d4038" stroke-width="2" opacity="0.4">
    <path d="M90 90 L150 150 M1510 90 L1450 160 M80 220 V250 M1520 230 V260"/>
  </g>

  <!-- circuitos laterales -->
  <g fill="none" stroke="#0d4038" stroke-width="2.5" opacity="0.3">
    <path d="M40 300 H110 V360 H60"/>
    <path d="M1560 300 H1490 V360 H1540"/>
    <path d="M40 180 H90 V240"/>
    <path d="M1560 180 H1510 V240"/>
  </g>
  <g fill="#0d4038" opacity="0.5">
    <circle cx="60" cy="360" r="5"/><circle cx="1540" cy="360" r="5"/>
    <circle cx="90" cy="240" r="5"/><circle cx="1510" cy="240" r="5"/>
  </g>

  <!-- frontón -->
  <polygon points="120,128 800,44 1480,128" fill="none" stroke="#123f39" stroke-width="6"/>
  <polygon points="150,122 800,60 1450,122" fill="none" stroke="#8f7d5a" stroke-width="2" opacity="0.8"/>

  <!-- nudo borromeo en el frontón -->
  <g fill="none" stroke-width="5">
    <circle cx="784" cy="88" r="22" stroke="#6f2f20"/>
    <circle cx="816" cy="88" r="22" stroke="#8f7d5a"/>
    <circle cx="800" cy="110" r="22" stroke="#0d4038"/>
  </g>
  <g stroke="#efe4cb" stroke-width="6">
    <path d="M794 70 L800 76 M822 102 L816 108 M784 104 L790 110"/>
  </g>

  <!-- arquitrabe -->
  <rect x="120" y="128" width="1360" height="44" fill="#123f39" stroke="#123f39" stroke-width="4"/>
  <g fill="#f1e7d4">
    <rect x="220" y="136" width="14" height="28"/><rect x="420" y="136" width="14" height="28"/>
    <rect x="620" y="136" width="14" height="28"/><rect x="980" y="136" width="14" height="28"/>
    <rect x="1180" y="136" width="14" height="28"/><rect x="1380" y="136" width="14" height="28"/>
  </g>
  <text x="800" y="160" text-anchor="middle" font-family="monospace" font-size="26" letter-spacing="10" fill="#f1e7d4">ΑΓΟΡΑ</text>

  <!-- columnata -->
  <g>
    <defs>
      <g id="colL">
        <rect x="0" y="0" width="90" height="228" fill="#f1e7d4" stroke="#123f39" stroke-width="4"/>
        <line x1="30" y1="8" x2="30" y2="220" stroke="#8f7d5a" stroke-width="2" opacity="0.6"/>
        <line x1="60" y1="8" x2="60" y2="220" stroke="#8f7d5a" stroke-width="2" opacity="0.6"/>
        <rect x="-8" y="-16" width="106" height="16" fill="#123f39"/>
        <rect x="-8" y="228" width="106" height="12" fill="#123f39"/>
        <rect x="-12" y="240" width="114" height="10" fill="#8f7d5a"/>
      </g>
    </defs>
    <use href="#colL" x="180" y="172"/>
    <use href="#colL" x="410" y="172"/>
    <use href="#colL" x="640" y="172"/>
    <use href="#colL" x="870" y="172"/>
    <use href="#colL" x="1100" y="172"/>
    <use href="#colL" x="1330" y="172"/>
  </g>

  <!-- escalinata -->
  <rect x="100" y="424" width="1400" height="14" fill="none" stroke="#123f39" stroke-width="3"/>
  <rect x="80" y="438" width="1440" height="12" fill="none" stroke="#8f7d5a" stroke-width="2" opacity="0.8"/>
</svg>
